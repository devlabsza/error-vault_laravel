name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', allow-insecure: true }
          - { php: '8.2', laravel: '11', allow-insecure: true }
          - { php: '8.3', laravel: '12' }
          - { php: '8.3', laravel: '13' }
          - { php: '8.4', laravel: '13' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
      # Laravel 10 and 11 are past security support, so Composer refuses every
      # release by default. This only affects the test install, not consumers.
      - if: ${{ matrix.allow-insecure }}
        run: composer config audit.block-insecure false
      - run: composer require --no-update --no-interaction "illuminate/support:^${{ matrix.laravel }}.0"
      - run: composer update --no-interaction --prefer-dist --with-all-dependencies
      - run: vendor/bin/phpunit tests
